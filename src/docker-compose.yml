version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payme-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - payme-storage:/var/www/storage
      - payme-db:/var/www/database

  web:
    image: nginx:1.25-alpine
    container_name: payme-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - payme-storage:/var/www/storage
    depends_on:
      - app

volumes:
  payme-storage:
  payme-db:
